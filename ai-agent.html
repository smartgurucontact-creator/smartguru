
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Guru AI Agent</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#080d1b;
 color:white;
 min-height:100vh;
 display:flex;
 flex-direction:column;
}
header{
 padding:18px;
 border-bottom:1px solid #26334d;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{font-size:21px;font-weight:bold;color:#38bdf8}
.back{color:#38bdf8;text-decoration:none}
main{
 width:100%;max-width:750px;
 margin:auto;padding:25px 16px;
 flex:1;
}
h1{text-align:center;font-size:30px}
.subtitle{text-align:center;color:#9caecb}
.panel{
 margin-top:25px;
 background:#111a2e;
 border:1px solid #26334d;
 border-radius:18px;
 padding:18px;
 min-height:330px;
}
.welcome{
 text-align:center;
 padding:35px 10px;
 color:#cbd5e1;
}
.welcome span{font-size:45px}
#messages{display:flex;flex-direction:column;gap:12px}
.message{
 padding:12px 15px;
 border-radius:13px;
 max-width:85%;
 line-height:1.5;
}
.bot{background:#1e2c45;align-self:flex-start}
.user{background:#075985;align-self:flex-end}
form{display:flex;flex-wrap:nowrap;align-items:stretch;gap:7px;margin-top:16px;width:100%}
input{
 flex:1 1 auto;min-width:0;width:0;
 padding:15px;
 border-radius:12px;
 border:1px solid #334155;
 background:#0b1425;
 color:white;
 font-size:15px;
}
button{
 border:0;border-radius:12px;
 padding:0 10px;
 background:#0284c7;color:white;
 font-size:16px;font-weight:bold;
}
.note{text-align:center;color:#94a3b8;font-size:12px;margin-top:14px}
</style>
</head>
<body>
<header>
 <div class="logo">🤖 Smart Guru</div>
 <a class="back" href="index.html">← Home</a>
</header>
<main>
 <h1>Smart Guru AI Agent</h1>
 <p class="subtitle">Your AI Assistant for Learning & Technology</p>
 <div class="panel">
  <div class="welcome" id="welcome">
   <span>🤖</span>
   <h3>Namaste! Welcome to Smart Guru</h3>
   <p>Ask me about technology, coding and learning.</p>
  </div>
  <div id="messages"></div>
 </div>
 <form id="chatForm">
  <button type="button" id="voiceBtn">🎤 Speak</button>
  <input id="question" placeholder="Type your message..." autocomplete="off" required>
  <button type="submit">Send</button>
 </form>
 <p class="note">AI replies will be enabled after connecting the secure AI backend.</p>
</main>
<script>
const voiceBtn = document.getElementById("voiceBtn");
const questionInput = document.getElementById("question");
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
 const recognition = new SpeechRecognition();
 let listening = false;
 recognition.lang = "hi-IN";
 recognition.continuous = false;
 recognition.interimResults = false;

 voiceBtn.addEventListener("click", function() {
   if (listening) return;
   try {
     recognition.start();
     listening = true;
     voiceBtn.textContent = "🎙️ Listening...";
   } catch (error) {
     voiceBtn.textContent = "🎤 Speak";
   }
 });

 recognition.onresult = function(event) {
   questionInput.value = event.results[0][0].transcript;
 };

 recognition.onend = function() {
   listening = false;
   voiceBtn.textContent = "🎤 Speak";
 };

 recognition.onerror = function() {
   listening = false;
   voiceBtn.textContent = "🎤 Speak";
   alert("Microphone permission check karein ya dobara try karein.");
 };
} else {
 voiceBtn.addEventListener("click", function() {
   alert("Voice Input is browser mein supported nahi hai. Chrome mein try karein.");
 });
}

document.getElementById("chatForm").addEventListener("submit",function(e){
 e.preventDefault();
 const input=document.getElementById("question");
 const text=input.value.trim();
 if(!text)return;
 document.getElementById("welcome").style.display="none";
 const msg=document.createElement("div");
 msg.className="message user";
 msg.textContent=text;
 document.getElementById("messages").appendChild(msg);
 input.value="";
 const reply=document.createElement("div");
 reply.className="message bot";
 const q=text.toLowerCase();
 let answer="Main abhi FAQ Assistant hoon. Aap mujhse Coding, Android, Website ya Technology ke baare mein pooch sakte hain.";
 if (/^(hi|hello|hey|namaste|नमस्ते)/.test(q)) answer="Namaste! Smart Guru mein aapka swagat hai. Main aapki kya madad kar sakta hoon?";
 
 else if (/coding|codding|कोडिंग|programming/.test(q)) answer="Coding ka matlab computer ko instructions dena hai. Jaise hum Hindi ya English mein baat karte hain, waise hi computer ko Python, JavaScript aur HTML jaisi languages se instructions dete hain. Example: HTML se website banti hai, JavaScript se website interactive hoti hai. Coding seekhne ke liye HTML se shuru karein.";
 else if (/python|पाइथन/.test(q)) answer="Python ek popular programming language hai. Iska use websites, automation, data analysis aur AI jaise projects mein hota hai. Example: print('Hello World') Python ka ek simple command hai.";
 else if (/html|एचटीएमएल/.test(q)) answer="HTML ka use website ka structure banane ke liye hota hai. Isse hum heading, paragraph, image aur links add kar sakte hain.";
 else if (/css|सीएसएस/.test(q)) answer="CSS ka use website ko sundar banane ke liye hota hai. Isse colors, fonts, spacing aur layout design kar sakte hain.";
 else if (/javascript|java script|जावास्क्रिप्ट/.test(q)) answer="JavaScript ek programming language hai. Iska use website ko interactive banane ke liye hota hai, jaise button click karne par action hona ya form submit karna.";
 else if (/android|phone|mobile/.test(q)) answer="Android tips: Phone ki Settings mein Storage aur Battery sections check karein. Kisi bhi app ko permission dene se pehle use samjhein.";
 
 else if (/website|वेबसाइट/.test(q)) answer="Website इंटरनेट पर मौजूद वेब पेजों का समूह होती है। जैसे Smart Guru एक वेबसाइट है, जहाँ आप जानकारी और ट्यूटोरियल पढ़ सकते हैं।";
else if (/internet|इंटरनेट|wifi|वाईफाई/.test(q)) answer="Internet दुनिया भर के कंप्यूटर और मोबाइल को जोड़ने वाला नेटवर्क है। इसकी मदद से हम जानकारी खोज सकते हैं, वीडियो देख सकते हैं और संदेश भेज सकते हैं।";
else if (/hang|hanging|slow|लटक|हैंग|धीमा/.test(q)) answer="मोबाइल हैंग होने के कई कारण हो सकते हैं, जैसे कम स्टोरेज, बहुत सारे ऐप खुले होना या पुराने सॉफ्टवेयर। अनावश्यक ऐप बंद करें और स्टोरेज चेक करें।";
else if (/technology|tech/.test(q)) answer="Technology ke baare mein jaanne ke liye apna sawal thoda detail mein likhein. Main basic jaankari de sakta hoon.";
 else if (/cyber safety|साइबर सुरक्षा|cyber security/.test(q)) answer="Cyber Safety का मतलब इंटरनेट और डिजिटल डिवाइस का सुरक्षित इस्तेमाल करना है। अपनी निजी जानकारी, पासवर्ड और OTP किसी के साथ साझा न करें।";
else if (/online fraud|ऑनलाइन फ्रॉड|online scam|ठगी/.test(q)) answer="Online Fraud से बचने के लिए अनजान लिंक पर क्लिक न करें, किसी को OTP या PIN न बताएं और पैसे पाने के लिए UPI PIN कभी न डालें।";
else if (/strong password|मजबूत पासवर्ड|पासवर्ड कैसा/.test(q)) answer="Strong Password ऐसा पासवर्ड होता है जिसे आसानी से कोई अनुमान न लगा सके। अक्षर, नंबर और विशेष चिन्ह मिलाकर लंबा और अलग पासवर्ड बनाएं।";
else if (/otp|ओटीपी/.test(q)) answer="OTP का पूरा नाम One Time Password है। यह एक बार इस्तेमाल होने वाला सुरक्षा कोड है। इसे किसी के साथ साझा न करें, चाहे कोई बैंक कर्मचारी बनकर ही क्यों न मांगे।";
else if (/computer|कंप्यूटर/.test(q)) answer="Computer एक इलेक्ट्रॉनिक मशीन है जो डेटा को प्रोसेस करके जानकारी देती है। इसका उपयोग पढ़ाई, काम, गणना और इंटरनेट चलाने में होता है।";
else if (/cpu|सीपीयू/.test(q)) answer="CPU का पूरा नाम Central Processing Unit है। इसे कंप्यूटर का मुख्य प्रोसेसिंग हिस्सा कहा जाता है। यह निर्देशों को प्रोसेस करता है।";
else if (/ram|रैम/.test(q)) answer="RAM का पूरा नाम Random Access Memory है। यह कंप्यूटर की अस्थायी मेमोरी है, जिसमें चल रहे ऐप और काम का डेटा रहता है।";
else if (/keyboard|कीबोर्ड|mouse|माउस/.test(q)) answer="Keyboard से हम कंप्यूटर में अक्षर और नंबर टाइप करते हैं। Mouse की मदद से स्क्रीन पर पॉइंटर चलाते हैं और चीजें चुनते हैं।";
else if (/my name is|माय नेम इज/.test(q)) answer='"My name is" का मतलब है "मेरा नाम है"। उदाहरण: My name is Rahul यानी मेरा नाम राहुल है।';
else if (/how are you|हाउ आर यू|कैसे हो/.test(q)) answer='"How are you?" का मतलब है "आप कैसे हैं?" इसका जवाब दे सकते हैं: "I am fine, thank you." यानी मैं ठीक हूँ, धन्यवाद।';
else if (/thank you|थैंक यू/.test(q)) answer='"Thank you" का मतलब है "धन्यवाद"। जवाब में आप "You are welcome" कह सकते हैं।';
else if (/introduction|परिचय|अपना परिचय/.test(q)) answer="अपना परिचय ऐसे दें: Hello! My name is Rahul. I am from India. I am learning English. यानी नमस्ते! मेरा नाम राहुल है। मैं भारत से हूँ। मैं अंग्रेज़ी सीख रहा हूँ।";
else if (/thank|धन्यवाद|shukriya/.test(q)) answer="Aapka swagat hai! Smart Guru par seekhte rahiye.";
 reply.textContent=answer;
 document.getElementById("messages").appendChild(reply);
});
</script>
</body>
</html>
